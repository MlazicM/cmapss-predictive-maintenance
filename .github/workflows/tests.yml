name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # TensorFlow and XGBoost are deliberately not installed: src/models.py
      # imports them lazily, so the whole data, preprocessing, evaluation and
      # API surface is testable without a 600 MB download.
      - name: Install test dependencies
        run: pip install numpy pandas scikit-learn fastapi pydantic httpx pytest

      - name: Run tests
        run: pytest

      - name: Check notebooks are committed without outputs
        run: |
          python - <<'PY'
          import json, pathlib, sys
          dirty = []
          for path in pathlib.Path("notebooks").glob("*.ipynb"):
              nb = json.loads(path.read_text())
              if any(c.get("outputs") for c in nb["cells"]):
                  dirty.append(str(path))
          if dirty:
              sys.exit("notebooks committed with outputs: " + ", ".join(dirty))
          print("notebooks clean")
          PY

  docker:
    # Builds the serving image and checks that it boots. The unit tests assert
    # what the image is *asked* to contain (tests/test_serving_image.py); only an
    # actual build catches a dependency that does not resolve or a COPY that
    # misses a file, and a Dockerfile nobody builds is a Dockerfile that rots.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the inference image
        run: docker build -t cmapss-rul:ci .

      - name: Start the service with no model mounted
        run: docker run -d --name rul -p 8000:8000 cmapss-rul:ci

      - name: Wait for /health
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf localhost:8000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          echo "service never became healthy"
          docker logs rul
          exit 1

      - name: The degraded state must be reported, not crashed
        run: |
          # No artifacts are baked into the image, so a container started without
          # a models/ mount has to answer /health with model_loaded=false and
          # return 503 from /predict -- the documented behaviour, not a crash.
          python -c "
          import json, sys
          body = json.load(open('/tmp/health.json'))
          assert body['status'] == 'ok', body
          assert body['model_loaded'] is False, body
          print('degraded state reported correctly')
          "
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"engine_id": 1, "readings": []}')
          test "$code" = "422" || { echo "expected 422 for an empty window, got $code"; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs rul
